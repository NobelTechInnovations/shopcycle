services:
  # Primary database since the Postgres/Supabase switch (381c56a). Matches
  # .env.example's local DATABASE_URL/DIRECT_URL exactly, so a fresh clone
  # runs with `docker compose up -d` + `pnpm db:push` + `pnpm db:seed`.
  # Production uses Supabase; this is the local stand-in.
  postgres:
    image: postgres:17-alpine
    container_name: shopcycle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopcycle
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopcycle"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Legacy — the app no longer uses MySQL (see postgres above). Kept only so
  # pre-switch local data isn't lost; safe to remove once nobody needs it.
  mysql:
    image: mysql:8.4
    container_name: shopcycle-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: shopcycle
      MYSQL_USER: shopcycle
      MYSQL_PASSWORD: shopcycle
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shopcycle-redis
    restart: unless-stopped
    ports:
      - "6380:6379" # host 6379 already taken by another local service
    volumes:
      - redis-data:/data

  adminer:
    image: adminer:latest
    container_name: shopcycle-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  postgres-data:
  mysql-data:
  redis-data:
